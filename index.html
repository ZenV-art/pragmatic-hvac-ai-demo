<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pragmatic HVAC — AI Front Desk Demo</title>
<meta property="og:title" content="Pragmatic HVAC — AI Front Desk">
<meta property="og:description" content="Hear Maya answer a 44°C AC emergency and book the job in 90 seconds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a0f;--panel:rgba(255,255,255,.04);--panel-brd:rgba(255,255,255,.08);
  --txt:#eef2f7;--muted:#8a94a6;--warm:#ff6a3d;--cool:#33d6ff;--cool2:#5b8bff;
  --good:#36e0a5;--danger:#ff5a6e;--radius:20px;--grad:linear-gradient(120deg,var(--warm),var(--cool));
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(900px 600px at 12% -8%,rgba(255,106,61,.16),transparent 60%),
    radial-gradient(1000px 700px at 100% 0%,rgba(51,214,255,.12),transparent 55%),var(--bg);
  color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:26px 18px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:1080px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--grad);box-shadow:0 8px 24px rgba(255,106,61,.35);font-size:19px}
.brand b{font-family:'Space Grotesk';font-weight:700;font-size:16px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langtog{display:flex;border:1px solid var(--panel-brd);border-radius:999px;overflow:hidden;font-size:13px}
.langtog button{padding:7px 15px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit}
.langtog button.on{background:var(--grad);color:#0a0d12;font-weight:600}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--panel-brd);padding:7px 13px;border-radius:999px;background:var(--panel);display:inline-flex;gap:9px;align-items:center}
.pill b{font-family:'Space Grotesk';color:var(--good);font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);backdrop-filter:blur(10px)}
.phone{padding:26px 24px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.callstate{font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:18px}
.callstate b{color:var(--txt)}
.orb-wrap{position:relative;width:184px;height:184px;display:grid;place-items:center;margin:4px 0 16px}
.orb{width:124px;height:124px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2,transparent 60%),var(--grad);
  box-shadow:0 18px 50px rgba(255,106,61,.35),inset 0 0 30px rgba(255,255,255,.15);display:grid;place-items:center;font-size:38px;transition:transform .3s}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.ring.r1{width:146px;height:146px}.ring.r2{width:168px;height:168px}.ring.r3{width:184px;height:184px}
.orb-wrap.speaking .orb{animation:breathe 1.1s ease-in-out infinite}
.orb-wrap.speaking .ring{animation:wave 1.6s ease-out infinite}
.orb-wrap.speaking .ring.r2{animation-delay:.25s}.orb-wrap.speaking .ring.r3{animation-delay:.5s}
.orb-wrap.listening .orb{background:radial-gradient(circle at 35% 30%,#fff2,transparent 60%),linear-gradient(120deg,var(--cool),var(--cool2));box-shadow:0 18px 50px rgba(51,214,255,.4)}
.orb-wrap.listening .ring{border-color:rgba(51,214,255,.3);animation:wave 1.3s ease-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes wave{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.12);opacity:0}}
.name-ava{font-family:'Space Grotesk';font-weight:600;font-size:20px}
.role-ava{color:var(--muted);font-size:13px;margin:2px 0 14px}
.timer{font-family:'Space Grotesk';font-size:14px;color:var(--cool);margin-bottom:14px;font-variant-numeric:tabular-nums}
.progress-wrap{width:100%;height:6px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;margin-bottom:16px}
.progress-bar{height:100%;width:0;background:var(--grad);border-radius:10px;transition:width .15s linear}
.controls{display:flex;flex-direction:column;gap:10px;width:100%}
.btn{border:none;cursor:pointer;font-family:'Inter','Noto Sans Devanagari';font-weight:600;font-size:15px;padding:14px 18px;border-radius:14px;color:#0a0d12;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s,box-shadow .25s,opacity .2s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--grad);box-shadow:0 12px 28px rgba(255,106,61,.32)}
.btn.primary:hover{box-shadow:0 16px 38px rgba(255,106,61,.45)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--panel-brd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rightcol{display:flex;flex-direction:column;gap:18px}
.convo{padding:20px 20px 16px;display:flex;flex-direction:column;min-height:380px}
.convo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.convo-head h3{font-family:'Space Grotesk';font-size:15px;font-weight:600}
.live-tag{font-size:11px;color:var(--good);border:1px solid rgba(54,224,165,.3);background:rgba(54,224,165,.08);padding:4px 9px;border-radius:999px}
.stream{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:6px;max-height:420px}
.stream::-webkit-scrollbar{width:6px}.stream::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px}
.msg{display:flex;gap:10px;max-width:92%;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .av{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;font-size:14px}
.msg.ava .av{background:var(--grad);color:#0a0d12}
.msg.caller{align-self:flex-end;flex-direction:row-reverse}
.msg.caller .av{background:rgba(255,255,255,.1)}
.bubble{padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.55}
.msg.ava .bubble{background:rgba(255,255,255,.06);border:1px solid var(--panel-brd);border-top-left-radius:4px}
.msg.caller .bubble{background:linear-gradient(120deg,rgba(51,214,255,.16),rgba(91,139,255,.16));border:1px solid rgba(51,214,255,.25);border-top-right-radius:4px}
.who{font-size:11px;color:var(--muted);margin-bottom:3px}
.empty-state{margin:auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;padding:26px}
.empty-state .big{font-size:30px;margin-bottom:10px}
.lead{padding:20px}
.lead h3{font-family:'Space Grotesk';font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lead .status{font-size:12px;color:var(--muted);margin-bottom:16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.fields{grid-template-columns:1fr}}
.field{background:rgba(255,255,255,.03);border:1px solid var(--panel-brd);border-radius:12px;padding:11px 13px;transition:.4s}
.field.filled{border-color:rgba(54,224,165,.4);background:rgba(54,224,165,.06)}
.field .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.field .val{font-size:14px;font-weight:600;min-height:18px}
.field .val.placeholder{color:#3c4658;font-weight:400}
.priority-badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;background:rgba(255,90,110,.16);color:var(--danger);border:1px solid rgba(255,90,110,.35)}
.outcome{margin-top:16px;border:1px solid rgba(54,224,165,.3);background:linear-gradient(120deg,rgba(54,224,165,.1),rgba(51,214,255,.06));border-radius:14px;padding:16px;display:none}
.outcome.show{display:block;animation:rise .5s ease}
.outcome .ttl{font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--good);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.outcome .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-size:12px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--panel-brd)}
.outcome .value{font-size:14px;color:var(--muted);line-height:1.7}
.outcome .value b{color:var(--txt);font-family:'Space Grotesk';font-size:18px}
.competitor-line{margin-top:10px;font-size:13px;color:var(--warm);font-style:italic}
.poster{position:absolute;inset:0;background:rgba(7,10,15,.86);backdrop-filter:blur(6px);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border-radius:var(--radius);cursor:pointer}
.poster .pulse{width:92px;height:92px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:36px;color:#0a0d12;box-shadow:0 0 0 0 rgba(255,106,61,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,61,.5)}70%{box-shadow:0 0 0 26px rgba(255,106,61,0)}100%{box-shadow:0 0 0 0 rgba(255,106,61,0)}}
.poster .ttl{font-family:'Space Grotesk','Noto Sans Devanagari';font-weight:600;font-size:18px}
.poster .sb{font-size:13px;color:var(--muted)}
.poster.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">❄️</div>
      <div><b>Pragmatic <span style="color:var(--cool)">HVAC</span></b><small id="brandSub">AI Front Desk</small></div>
    </div>
    <div class="topright">
      <div class="langtog"><button data-lang="en" class="on">EN</button><button data-lang="hi">हिंदी</button></div>
      <span class="pill"><span id="recLabel">Recovered on this call</span>&nbsp; <b id="recovered">₹0</b></span>
    </div>
  </div>

  <div class="grid">
    <div class="card phone">
      <div class="poster" id="poster">
        <div class="pulse">▶</div>
        <div class="ttl" id="posterTitle">Play the call</div>
        <div class="sb" id="posterSub">🔊 sound on · 90 seconds</div>
      </div>
      <div class="callstate"><b id="statetext">Ready</b></div>
      <div class="orb-wrap" id="orb">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="orb"><span id="orbface">🤖</span></div>
      </div>
      <div class="name-ava">Maya</div>
      <div class="role-ava">AI Receptionist · Pragmatic HVAC</div>
      <div class="timer" id="timer">00:00</div>
      <div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>
      <div class="controls">
        <button class="btn primary" id="playBtn">▶ &nbsp;Play the call</button>
        <button class="btn ghost" id="replayBtn" style="display:none">⟲ Replay</button>
      </div>
    </div>

    <div class="rightcol">
      <div class="card convo">
        <div class="convo-head"><h3 id="transcriptHead">📞 Live transcript</h3><span class="live-tag" id="liveTag" style="visibility:hidden">● LIVE</span></div>
        <div class="stream" id="stream"><div class="empty-state" id="emptyState"></div></div>
      </div>
      <div class="card lead">
        <h3><span id="leadHead">🎯 Lead capture</span> <span class="priority-badge" id="prioBadge" style="display:none"></span></h3>
        <div class="status" id="leadStatus"></div>
        <div class="fields">
          <div class="field" data-f="issue"><div class="lbl" data-l="issue"></div><div class="val placeholder">—</div></div>
          <div class="field" data-f="name"><div class="lbl" data-l="name"></div><div class="val placeholder">—</div></div>
          <div class="field" data-f="address"><div class="lbl" data-l="address"></div><div class="val placeholder">—</div></div>
          <div class="field" data-f="phone"><div class="lbl" data-l="phone"></div><div class="val placeholder">—</div></div>
          <div class="field" data-f="time"><div class="lbl" data-l="time"></div><div class="val placeholder">—</div></div>
          <div class="field" data-f="tech"><div class="lbl" data-l="tech"></div><div class="val placeholder">—</div></div>
        </div>
        <div class="outcome" id="outcome">
          <div class="ttl" id="outcomeTtl"></div>
          <div class="chips" id="chips"></div>
          <div class="value" id="outcomeValue"></div>
          <div class="competitor-line" id="competitorLine"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- load both language manifests, capture each into a distinct global -->
<script src="audio/manifest.js"></script><script>window.__EN=window.CALL_MANIFEST;</script>
<script src="audio-hi/manifest.js"></script><script>window.__HI=window.CALL_MANIFEST;</script>
<script>
const $ = id => document.getElementById(id);
const MANI = { en: window.__EN || [], hi: window.__HI || [] };
const BASE = { en: 'audio/', hi: 'audio-hi/' };
const RECOVERED = 2400;

const L = {
  en: {
    brandSub:"AI Front Desk", ready:"Ready", speaking:"Maya is speaking", listening:"Caller is speaking", oncall:"On call",
    play:"▶  Play the call", inprogress:"● Call in progress…", replay:"⟲ Replay",
    posterTitle:"Play the call", posterSub:"🔊 sound on · 90 seconds", recLabel:"Recovered on this call",
    transcript:"📞 Live transcript", empty:"Press <b>Play the call</b> and listen to Maya book the job in real time.",
    leadHead:"🎯 Lead capture", priority:"⚠ PRIORITY",
    statusIdle:"Fields fill in automatically as Maya talks…", statusCapturing:"Capturing details from the conversation…",
    statusBooked:"✅ Booked. Confirmation texted to the customer & lead sent to the team.",
    fields:{issue:"Issue",name:"Customer",address:"Service address",phone:"Callback #",time:"Appointment",tech:"Assigned tech"},
    outcomeTtl:"✅ Job booked & lead delivered",
    chips:["📲 SMS confirmation sent","📥 Pushed to CRM","🔔 Owner alerted"],
    value:'Estimated job value <b>₹1,500–₹6,000</b><br>This is the call your competitor would have grabbed.',
    competitor:t=>`⏱ Handled in ${t} — no hold music, no missed call.`, who:{maya:"Maya",caller:"Caller"}
  },
  hi: {
    brandSub:"AI फ्रंट डेस्क", ready:"तैयार", speaking:"Maya बोल रही है", listening:"ग्राहक बोल रहा है", oncall:"कॉल जारी",
    play:"▶  कॉल चलाएँ", inprogress:"● कॉल जारी…", replay:"⟲ दोबारा सुनें",
    posterTitle:"कॉल चलाएँ", posterSub:"🔊 आवाज़ चालू · 90 सेकंड", recLabel:"इस कॉल से रिकवर",
    transcript:"📞 लाइव ट्रांसक्रिप्ट", empty:"<b>कॉल चलाएँ</b> दबाइए और सुनिए Maya कैसे रियल टाइम में जॉब बुक करती है।",
    leadHead:"🎯 लीड कैप्चर", priority:"⚠ प्राथमिकता",
    statusIdle:"Maya के बात करते ही जानकारी अपने‑आप भरती जाती है…", statusCapturing:"बातचीत से जानकारी ली जा रही है…",
    statusBooked:"✅ बुक हो गया। ग्राहक को confirmation भेजा और टीम को लीड।",
    fields:{issue:"समस्या",name:"ग्राहक",address:"पता",phone:"कॉलबैक नंबर",time:"अपॉइंटमेंट",tech:"टेक्नीशियन"},
    outcomeTtl:"✅ जॉब बुक · लीड भेजी गई",
    chips:["📲 confirmation SMS भेजा","📥 CRM में सेव","🔔 ओनर को अलर्ट"],
    value:'अनुमानित जॉब वैल्यू <b>₹1,500–₹6,000</b><br>यही वो कॉल है जो आपका कॉम्पिटिटर ले जाता।',
    competitor:t=>`⏱ ${t} में हैंडल — न होल्ड म्यूज़िक, न मिस्ड कॉल।`, who:{maya:"Maya",caller:"ग्राहक"}
  }
};

const stream=$("stream"), emptyState=$("emptyState"), orb=$("orb"), orbface=$("orbface"),
      stateText=$("statetext"), timerEl=$("timer"), prog=$("prog"), playBtn=$("playBtn"),
      replayBtn=$("replayBtn"), poster=$("poster"), liveTag=$("liveTag"), leadStatus=$("leadStatus"),
      outcome=$("outcome"), prioBadge=$("prioBadge"), recoveredEl=$("recovered"), competitorLine=$("competitorLine");

let lang='en', t=L.en, manifest=MANI.en, audios=[], idx=0, playing=false, t0=0, timerInt=null;

function buildAudios(){ audios = manifest.map(m => { const a=new Audio(BASE[lang]+m.file); a.preload="auto"; return a; }); }

function applyLang(){
  t = L[lang];
  document.documentElement.lang = lang;
  $("brandSub").textContent=t.brandSub;
  $("recLabel").textContent=t.recLabel;
  $("posterTitle").textContent=t.posterTitle;
  $("posterSub").textContent=t.posterSub;
  $("transcriptHead").innerHTML=t.transcript;
  $("leadHead").textContent=t.leadHead;
  $("outcomeTtl").textContent=t.outcomeTtl;
  $("outcomeValue").innerHTML=t.value;
  $("chips").innerHTML=t.chips.map(c=>`<span class="chip">${c}</span>`).join("");
  document.querySelectorAll('.lbl[data-l]').forEach(el=>el.textContent=t.fields[el.dataset.l]);
  document.querySelectorAll('.langtog button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));
}

function setOrb(mode){
  orb.classList.remove("speaking","listening");
  if(mode==="speaking"){ orb.classList.add("speaking"); stateText.textContent=t.speaking; orbface.textContent="💬"; }
  else if(mode==="listening"){ orb.classList.add("listening"); stateText.textContent=t.listening; orbface.textContent="🧑"; }
  else { stateText.textContent= playing?t.oncall:t.ready; orbface.textContent="🤖"; }
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function addMsg(who,text){
  emptyState.style.display="none";
  const m=document.createElement("div");
  m.className="msg "+(who==="maya"?"ava":"caller");
  m.innerHTML=`<div class="av">${who==="maya"?"🤖":"🧑"}</div><div><div class="who">${t.who[who]}</div><div class="bubble">${escapeHtml(text)}</div></div>`;
  stream.appendChild(m); stream.scrollTop=stream.scrollHeight;
}
function setField(key,val){
  const f=document.querySelector(`.field[data-f="${key}"]`); if(!f) return;
  const v=f.querySelector(".val"); v.textContent=val; v.classList.remove("placeholder"); f.classList.add("filled");
}
function applyAction(a){
  if(!a) return;
  if(a.book){ book(); return; }
  if(a.set==="priority"){ prioBadge.textContent=t.priority; prioBadge.style.display="inline-block"; if(a.status) leadStatus.textContent=a.status; return; }
  if(a.set) setField(a.set, a.value);
}
function startTimer(){ t0=Date.now(); timerInt=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); timerEl.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); },300); }
function stopTimer(){ clearInterval(timerInt); }
function updateProgress(){
  let frac=0; const a=audios[idx];
  if(a && a.duration && isFinite(a.duration)) frac=a.currentTime/a.duration;
  prog.style.width=Math.min(100,((idx+frac)/manifest.length)*100)+"%";
}
function playLine(i){
  if(i>=manifest.length){ finish(); return; }
  idx=i; const line=manifest[i], a=audios[i];
  setOrb(line.speaker==="maya"?"speaking":"listening");
  addMsg(line.speaker, line.text);
  a.currentTime=0; a.ontimeupdate=updateProgress;
  a.onended=()=>{ applyAction(line.action); setTimeout(()=>playLine(i+1), 350); };
  const p=a.play(); if(p && p.catch) p.catch(()=>{});
}
function start(){
  if(playing) return; playing=true;
  poster.classList.add("hidden");
  playBtn.disabled=true; playBtn.textContent=t.inprogress;
  replayBtn.style.display="none"; liveTag.style.visibility="visible";
  leadStatus.textContent=t.statusCapturing;
  startTimer(); setOrb("speaking"); playLine(0);
}
function finish(){
  playing=false; stopTimer(); setOrb("idle"); prog.style.width="100%";
  liveTag.style.visibility="hidden"; playBtn.style.display="none"; replayBtn.style.display="flex";
}
function book(){
  outcome.classList.add("show");
  competitorLine.textContent=t.competitor(timerEl.textContent);
  leadStatus.textContent=t.statusBooked;
  bumpRecovered(RECOVERED);
}
function bumpRecovered(amount){
  const s0=0,end=amount,dur=900,tt=performance.now();
  (function step(now){ const p=Math.min(1,(now-tt)/dur); const v=Math.round(s0+(end-s0)*(1-Math.pow(1-p,3)));
    recoveredEl.textContent="₹"+v.toLocaleString('en-IN'); if(p<1) requestAnimationFrame(step); })(tt);
}
function reset(){
  playing=false; stopTimer(); idx=0; prog.style.width="0";
  audios.forEach(a=>{ try{a.pause();}catch(e){} });
  stream.innerHTML=""; stream.appendChild(emptyState); emptyState.style.display="block"; emptyState.innerHTML=`<div class="big">🎧</div>${t.empty}`;
  timerEl.textContent="00:00"; outcome.classList.remove("show"); prioBadge.style.display="none";
  leadStatus.textContent=t.statusIdle;
  document.querySelectorAll(".field").forEach(f=>{ f.classList.remove("filled"); const v=f.querySelector(".val"); v.textContent="—"; v.classList.add("placeholder"); });
  recoveredEl.textContent="₹0"; setOrb("idle");
  playBtn.style.display="flex"; playBtn.disabled=false; playBtn.textContent=t.play; replayBtn.style.display="none";
  replayBtn.textContent=t.replay; poster.classList.remove("hidden");
}
function setLang(l){
  if(l===lang && audios.length) return;
  lang=l; manifest=MANI[lang]; buildAudios(); applyLang(); reset();
}

document.querySelectorAll('.langtog button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
playBtn.addEventListener("click",start);
poster.addEventListener("click",start);
replayBtn.addEventListener("click",()=>{ reset(); start(); });

// init
buildAudios(); applyLang(); reset();
if(!MANI.en.length){ emptyState.innerHTML='<div class="big">⚠️</div>Audio not generated.'; playBtn.disabled=true; }
</script>
</body>
</html>
